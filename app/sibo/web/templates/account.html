{% extends "base.html" %}
{% block title %}我的账号{% endblock %}
{% block content %}
<div class="topbar"><div><h1>我的账号</h1><div class="sub">{{ user.name }} · {{ user.email }} · {{ ROLES[user.role] }}</div></div></div>
<div class="card" style="max-width:520px">
  <h2>修改密码</h2>
  {% if error %}<div class="notice bad">{{ error }}</div>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field"><label>当前密码</label><input type="password" name="old" required autocomplete="current-password"></div>
    <div class="field"><label>新密码 <span class="hint">至少 8 位</span></label><input type="password" name="new" required minlength="8" autocomplete="new-password"></div>
    <div class="field"><label>再输一次新密码</label><input type="password" name="new2" required minlength="8" autocomplete="new-password"></div>
    <button class="btn primary">保存</button>
  </form>
  <p class="small muted" style="margin-top:12px">忘记密码时，请机构管理员在「机构设置 → 成员」中为你生成重设链接。</p>
</div>
{% endblock %}
